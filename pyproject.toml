[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sable-engine"
version = "0.1.0"
description = "SABLE: sparse APL-branch ledger engine — quantum-seeded, energy-aware SUBLEQ execution"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["sable*"]
